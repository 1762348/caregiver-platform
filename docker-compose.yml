services:
  mysql:
    image: mysql:8.0
    container_name: caregiver-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: caregiver_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - caregiver

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caregiver-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/caregiver_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 字节）}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      SMS_FIXED_CODE: ${SMS_FIXED_CODE:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-change-me}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - caregiver

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: caregiver-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - caregiver

volumes:
  mysql-data:

networks:
  caregiver:
    driver: bridge
