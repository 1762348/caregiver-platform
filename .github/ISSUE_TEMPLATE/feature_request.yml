name: 功能建议
description: 提出一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 用户端
        - 护工端
        - 管理后台
        - 后端接口
        - 部署与运维
        - 文档
