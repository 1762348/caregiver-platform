# 测试环境：内存 H2，MySQL 兼容模式，CI 与本地均无需外部数据库
spring:
  datasource:
    url: jdbc:h2:mem:caregiver;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: warn
    com.youhu.caregiver: info
