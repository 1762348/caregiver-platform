spring:
  application:
    name: caregiver-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # 数据库版本管理：启动时自动执行 classpath:db/migration 下的迁移脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# 应用配置
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    issuer: caregiver-platform
    expires-minutes: ${JWT_EXPIRE_MINUTES:10080}
  sms:
    provider: mock
    # 开发环境固定验证码；生产环境必须置空并使用真实短信服务
    fixed-code: ${SMS_FIXED_CODE:123456}
    ttl-seconds: 300
    resend-interval-seconds: 60
    max-attempts: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  payment:
    # Mock 支付回调签名密钥；接入真实网关后由渠道密钥替代
    mock-secret: ${MOCK_PAYMENT_SECRET:mock-payment-secret}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
